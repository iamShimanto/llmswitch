services:
  llmswitch:
    build: .
    image: ghcr.io/iamshimanto/llmswitch:latest
    container_name: llmswitch
    restart: unless-stopped
    ports:
      - "6000:6000"
    volumes:
      - llmswitch-data:/app/data
    env_file:
      - .env
    environment:
      PORT: 6000
      DATA_DIR: /app/data

volumes:
  llmswitch-data:

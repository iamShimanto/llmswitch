services:
  llmswitch:
    build: .
    image: ghcr.io/iamshimanto/llmswitch:latest
    container_name: llmswitch
    restart: unless-stopped
    ports:
      - "6000:6000"
    volumes:
      - llmswitch-data:/app/data
    env_file:
      - .env
    environment:
      PORT: 6000
      DATA_DIR: /app/data
      CHATGPT_BRIDGE_URL: http://browser-bridge:6100
    depends_on:
      - browser-bridge

  browser-bridge:
    build: ./services/browser-bridge
    image: llmswitch-browser-bridge:latest
    container_name: llmswitch-browser-bridge
    restart: unless-stopped
    # Internal only — the gateway reaches it over the compose network;
    # no port is published to the host.
    expose:
      - "6100"

volumes:
  llmswitch-data:

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test --workspace @llmswitch/web-session
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke-p1.mjs
